name: Build SPFx 1.24 example

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spfx-build.yml"
      - "examples/spfx124-webpart/**"
      - "packages/sharepoint-ui/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/spfx-build.yml"
      - "examples/spfx124-webpart/**"
      - "packages/sharepoint-ui/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spfx-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/spfx124-webpart/package-lock.json
      - run: npm ci
      - run: npm run build:library
      - run: npm ci --prefix examples/spfx124-webpart
      - run: npm run build --prefix examples/spfx124-webpart
